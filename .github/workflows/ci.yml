name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache-dependency-path: bugtracker-backend/go.sum

      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@latest

      - name: Execute Backend Unit Tests
        working-directory: ./bugtracker-backend
        run: |
          go test -v ./... 2>&1 | go-junit-report > test-results.xml

      - name: Publish Backend Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Unit Test Report
          path: bugtracker-backend/test-results.xml
          reporter: jest-junit

  unit-tests-frontend:
    needs: unit-tests-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bugtracker-frontend/package-lock.json

      - name: Execute Frontend Unit Tests
        working-directory: ./bugtracker-frontend
        run: |
          npm ci
          npm test

      - name: Publish Frontend Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend Unit Test Report
          path: bugtracker-frontend/test-results.xml
          reporter: jest-junit
  
  api-e2e-perf-tests:
    needs: [unit-tests-backend, unit-tests-frontend]
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Launch Application
        run: |
          docker compose up --build -d
          npx wait-port http://localhost:8080/api/health -t 30000

      - name: Run API Tests
        working-directory: ./tests-api
        run: |
          npm ci
          npx playwright test
      
      - name: Run E2E Tests
        working-directory: ./tests-e2e
        env:
          CI: "1"
        run: |
          npm ci
          npx playwright install
          npx playwright test

      - name: Setup K6
        uses: grafana/setup-k6-action@v1

      - name: Run Performance Tests
        uses: grafana/setup-k6-action@v1
        with:
          script: ./tests-per/scripts.js
          flags: --out json=summary.json

      - name: Shut Down Application
        if: always()
        run: docker compose down

      - name: Upload API Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: ./tests-api/test-results/
          retention-days: 30

      - name: Upload API Test ResultsPlayWright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-playwright-report
          path: ./tests-api/playwright-report/
          retention-days: 30

      - name: Upload E2E Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: ./tests-e2e/test-results/
          retention-days: 30

      - name: Upload E2E Test Results PlayWright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-playwright-report
          path: ./tests-e2e/playwright-report/
          retention-days: 30

      - name: Publish API Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: API Tests Report
          path: tests-api/test-results/*.xml
          reporter: jest-junit  

      - name: Publish E2E Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Tests Report
          path: tests-e2e/test-results/results.xml
          reporter: jest-junit